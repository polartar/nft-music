alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
databases:
  - cluster_name: secretgarden-database
    engine: MONGODB
    name: secretgarden-database
    production: true
    version: "4"
domains:
  - domain: secretgarden.fm
    type: PRIMARY
    zone: secretgarden.fm
  - domain: www.secretgarden.fm
    type: ALIAS
    zone: secretgarden.fm
  - domain: secretgarden.xyz
    type: ALIAS
    zone: secretgarden.xyz
  - domain: www.secretgarden.xyz
    type: ALIAS
    zone: secretgarden.xyz
name: secretgarden
region: nyc
services:
  - build_command: npm run build
    environment_slug: node-js
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${secretgarden-database.DATABASE_URL}
    github:
      branch: editions
      deploy_on_push: true
      repo: Ericxgao/secretgarden
    http_port: 8081
    instance_count: 2
    instance_size_slug: professional-xs
    name: secretgarden
    dockerfile_path: Dockerfile
    routes:
      - path: /
    run_command: npm run server
    source_dir: /
